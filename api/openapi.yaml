        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: OIDC access token for workforce users. }
    offerToken: { type: apiKey, in: header, name: X-Offer-Token, description: Short-lived single-offer candidate token. }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"4"' }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    RequisitionId: { name: requisitionId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    IntakeId: { name: intakeId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    InterviewId: { name: interviewId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    OfferId: { name: offerId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    DepartmentId: { name: departmentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    PositionId: { name: positionId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EventId: { name: eventId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ContractId: { name: contractId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AddendumId: { name: addendumId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  headers:
    ETag: { description: Quoted numeric resource version., schema: { type: string, example: '"5"' } }
    Location: { description: Created resource URI., schema: { type: string, format: uri-reference } }
  responses:
    BadRequest: { description: Malformed request or If-Match header, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Unauthorized: { description: Authentication is required or invalid, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Forbidden: { description: Insufficient permission, field access or data scope, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    NotFound: { description: Resource is not visible or does not exist, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Conflict: { description: Workflow, prerequisite, uniqueness or concurrency conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/BusinessProblemDetails' } } } }
    UnprocessableEntity: { description: Semantically invalid fields, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblemDetails' } } } }
    PayloadTooLarge: { description: File exceeds its documented limit, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    UnsupportedMediaType: { description: File type is not allowed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    PageMetadata:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties: { page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1 }, totalItems: { type: integer, format: int64, minimum: 0 }, totalPages: { type: integer, minimum: 0 } }
    ReasonRequest: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 1000 } } }
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, correlationId]
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer, minimum: 400, maximum: 599 }, detail: { type: string }, instance: { type: string }, correlationId: { type: string }, code: { type: string } }
    BusinessProblemDetails:
      allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [code], properties: { code: { type: string } } }]
    ValidationProblemDetails:
      allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [errors], properties: { errors: { type: object, additionalProperties: { type: array, items: { type: string } } } } }]

    RequisitionStatus: { type: string, enum: [draft, pending_approval, approved, active_recruiting, closed, cancelled] }
    EmploymentType: { type: string, enum: [full_time, part_time, hybrid, remote, internship, service_contract] }
    RequisitionWrite:
      type: object
      required: [title, departmentId, employmentType, targetHeadcount]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        departmentId: { type: integer, format: int64, minimum: 1 }
        positionId: { type: integer, format: int64, minimum: 1, nullable: true }
        description: { type: string, maxLength: 20000, nullable: true }
        requirements: { type: string, maxLength: 20000, nullable: true }
        location: { type: string, maxLength: 255, nullable: true }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        salaryMin: { type: number, minimum: 0, nullable: true }
        salaryMax: { type: number, minimum: 0, nullable: true }
        targetHeadcount: { type: integer, minimum: 1 }
        closingDate: { type: string, format: date, nullable: true }
    Requisition:
      allOf:
        - $ref: '#/components/schemas/RequisitionWrite'
        - type: object
          required: [id, jobCode, status, version, createdAt, updatedAt]
          properties: { id: { type: integer, format: int64 }, jobCode: { type: string }, status: { $ref: '#/components/schemas/RequisitionStatus' }, publishedAt: { type: string, format: date-time, nullable: true }, createdBy: { type: integer, format: int64 }, version: { type: integer, format: int64, minimum: 1 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    RequisitionAction:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, minLength: 1, maxLength: 1000, nullable: true }, channels: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [careers_portal, linkedin, topcv] } } }
    RequisitionPage: { type: object, required: [items, page], properties: { items: { type: array, items: { $ref: '#/components/schemas/Requisition' } }, page: { $ref: '#/components/schemas/PageMetadata' } } }

    CandidateInput:
      type: object
      required: [firstName, lastName, email]
      properties: { firstName: { type: string, maxLength: 100 }, lastName: { type: string, maxLength: 100 }, email: { type: string, format: email, maxLength: 320 }, phone: { type: string, maxLength: 30, nullable: true }, linkedinUrl: { type: string, format: uri, nullable: true }, portfolioUrl: { type: string, format: uri, nullable: true } }
    CandidateSummary:
      allOf: [{ $ref: '#/components/schemas/CandidateInput' }, { type: object, required: [id], properties: { id: { type: integer, format: int64 } } }]
    ResumeUpload:
      type: object
      additionalProperties: false
      required: [file, requisitionId, privacyNoticeVersion, consented]
      properties: { file: { type: string, format: binary }, requisitionId: { type: integer, format: int64, minimum: 1 }, privacyNoticeVersion: { type: string, maxLength: 50 }, consented: { type: boolean, enum: [true] } }
    CandidateIntake:
      type: object
      required: [id, requisitionId, status, uploadedAt]
      properties: { id: { type: string, format: uuid }, requisitionId: { type: integer, format: int64 }, status: { type: string, enum: [scanning, parsing, awaiting_confirmation, duplicate_review, completed, rejected, failed] }, parsedCandidate: { $ref: '#/components/schemas/CandidateInput' }, confidence: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }, duplicateCandidates: { type: array, items: { $ref: '#/components/schemas/CandidateSummary' } }, uploadedAt: { type: string, format: date-time } }
    ConfirmIntake:
      type: object
      additionalProperties: false
      required: [candidate]
      properties: { candidate: { $ref: '#/components/schemas/CandidateInput' }, existingCandidateId: { type: integer, format: int64, minimum: 1, nullable: true }, source: { type: string, maxLength: 80, default: direct } }

    RecruitmentStage: { type: string, enum: [sourced_applied, ai_screening, tech_interview, executive_round, offer_letter, hired_ready, rejected, withdrawn] }
