    ContractAddendum:
      allOf: [{ $ref: '#/components/schemas/ContractAddendumWrite' }, { type: object, required: [id, contractId, status, version, createdBy], properties: { id: { type: integer, format: int64 }, contractId: { type: integer, format: int64 }, status: { type: string, enum: [draft, pending_approval, approved, effective, superseded, cancelled] }, version: { type: integer, minimum: 1 }, createdBy: { type: integer, format: int64 }, approvedBy: { type: integer, format: int64, nullable: true }, approvedAt: { type: string, format: date-time, nullable: true }, signedAt: { type: string, format: date-time, nullable: true }, signedDocumentAvailable: { type: boolean } } }]
