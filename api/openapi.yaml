    PositionWrite: { type: object, required: [code, name], properties: { code: { type: string, maxLength: 50 }, name: { type: string, maxLength: 255 }, level: { type: string, maxLength: 50, nullable: true }, description: { type: string, maxLength: 5000, nullable: true } } }
