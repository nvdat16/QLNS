services:
  db:
    image: postgres:16-alpine
    container_name: qlns_postgres
    restart: always
    environment:
      POSTGRES_USER: qlns_user
      POSTGRES_PASSWORD: qlns_password
      POSTGRES_DB: qlns_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlns_user -d qlns_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qlns_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://qlns_user:qlns_password@db:5432/qlns_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
