openapi: 3.0.3
info:
  title: QLNS API
  version: 1.0.0
  description: >-
    Contract-first API for the delivery scope agreed on the functional decomposition
    map (topdown-approach.png): the functions printed in bold under Recruitment and
    under Core HR, where Core HR includes Contract Management and the employee
    lifecycle. Everything else on the map is out of scope for this delivery —
    System Administration, Reports & Analytics, Performance Management,
    Compensation & Benefits and Attendance & Leave — together with the four
    non-bold functions inside the two selected pillars: Headcount & Budget
    Validation, Recruitment Channel Management, Organizational Chart, and
    Suspension & Return to Work. See README.md section 2 for the scope table.
    Workflow changes use explicit commands, ETag/If-Match concurrency control,
    server-side authorization, audit logging and transactional outbox delivery.
    x-implementation-status values: proposed (contract only), code-complete (controller,
    authorization policy, business workflow, transactional persistence with audit/outbox and
    unit tests exist under src/backend; integration/contract tests against PostgreSQL are
    still pending), implemented (all of the above plus integration tests).
    Audit logging and outbox delivery remain crosscutting mechanisms; the
    administration endpoints that would expose or configure them are out of scope.
servers:
  - url: http://localhost:5000
    description: Local ASP.NET Core development server
security:
  - bearerAuth: []
tags:
  - { name: Recruitment Requisitions }
  - { name: Recruitment Intake }
  - { name: Recruitment Pipeline }
  - { name: Recruitment Interviews }
  - { name: Recruitment Evaluations }
  - { name: Recruitment Offers }
  - { name: Employees }
  - { name: Organization }
  - { name: Onboarding }
  - { name: Employee Events }
  - { name: Employee Documents }
  - { name: Contracts }
  - { name: Contract Addenda }
  - { name: Probation }
  - { name: Offboarding }
  - { name: Operations }

paths:
  /api/v1/recruitment/requisitions:
    get:
      tags: [Recruitment Requisitions]
      operationId: listRecruitmentRequisitions
      x-implementation-status: code-complete
      summary: Search requisitions in the actor's data scope
      x-requirement: REC-01.1, REC-01.2
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: departmentId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequisitionStatus' } }
        - name: sort
          in: query
          description: Allowlist is createdAt, -createdAt, closingDate, -closingDate.
          schema: { type: string, default: -createdAt }
      responses:
        '200': { description: Paged requisitions, content: { application/json: { schema: { $ref: '#/components/schemas/RequisitionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Recruitment Requisitions]
      operationId: createRecruitmentRequisition
      x-implementation-status: code-complete
      summary: Create a draft requisition
      x-requirement: REC-01.1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequisitionWrite' } } } }
      responses:
        '201':
          description: Draft created
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Requisition' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/requisitions/{requisitionId}:
    parameters: [{ $ref: '#/components/parameters/RequisitionId' }]
    get:
      tags: [Recruitment Requisitions]
      operationId: getRecruitmentRequisition
      x-implementation-status: code-complete
      summary: Get one requisition
      x-requirement: REC-01.1, REC-01.2
      responses:
        '200':
          description: Requisition
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Requisition' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Recruitment Requisitions]
      operationId: replaceRecruitmentRequisitionDraft
      x-implementation-status: code-complete
      summary: Replace editable fields of a draft or returned requisition
      x-requirement: REC-01.1
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequisitionWrite' } } } }
      responses:
        '200':
          description: Draft updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Requisition' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/requisitions/{requisitionId}/{action}:
    post:
      tags: [Recruitment Requisitions]
      operationId: transitionRecruitmentRequisition
      x-implementation-status: code-complete
      summary: Submit, approve, reject, publish, close or cancel a requisition
      description: >-
        Reject requires a reason. Publishing makes the posting visible on the single
        built-in careers channel; multi-channel distribution (Recruitment Channel
        Management) is out of scope for this delivery.
      x-requirement: REC-01.2
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject, publish, close, cancel] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RequisitionAction' } } } }
      responses:
        '200':
          description: Transition completed
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Requisition' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/resumes:
    post:
      tags: [Recruitment Intake]
      operationId: startRecruitmentIntake
      x-implementation-status: code-complete
      summary: Scan and parse a PDF, DOC or DOCX resume up to 10 MiB
      x-requirement: REC-02.1
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ResumeUpload' } } } }
      responses:
        '202':
          description: Intake accepted
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CandidateIntake' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/intakes/{intakeId}:
    get:
      tags: [Recruitment Intake]
      operationId: getRecruitmentIntake
      x-implementation-status: code-complete
      summary: Get scan, parse and duplicate-detection state
      x-requirement: REC-02.1, REC-02.2
      parameters: [{ $ref: '#/components/parameters/IntakeId' }]
      responses:
        '200': { description: Intake, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateIntake' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/recruitment/intakes/{intakeId}/confirm:
    post:
      tags: [Recruitment Intake]
      operationId: confirmRecruitmentIntake
      x-implementation-status: code-complete
      summary: Confirm parsed data, resolve duplicates and create an application
      x-requirement: REC-02.2
      parameters:
        - $ref: '#/components/parameters/IntakeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmIntake' } } } }
      responses:
        '201':
          description: Application created
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentApplicationDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/pipeline:
    get:
      tags: [Recruitment Pipeline]
      operationId: getRecruitmentPipeline
      x-implementation-status: code-complete
      summary: Get a filtered, paged Kanban pipeline
      x-requirement: REC-03.1
      parameters:
        - { name: requisitionId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - $ref: '#/components/parameters/Search'
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/RecruitmentStage' } }
        - { name: minimumAiScore, in: query, schema: { type: number, minimum: 0, maximum: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Pipeline, content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentPipeline' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/recruitment/applications/{applicationId}:
    get:
      tags: [Recruitment Pipeline]
      operationId: getRecruitmentApplication
      x-implementation-status: code-complete
      summary: Get one authorized recruitment application
      x-requirement: REC-03.1, REC-03.2
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Application
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentApplication' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/recruitment/applications/{applicationId}/advance:
    post:
      tags: [Recruitment Pipeline]
      operationId: advanceRecruitmentApplication
      x-implementation-status: code-complete
      summary: Advance an application exactly one active stage
      x-requirement: REC-03.2
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceApplicationRequest' } } } }
      responses:
        '200':
          description: Application advanced
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentApplication' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/applications/{applicationId}/{terminalAction}:
    post:
      tags: [Recruitment Pipeline]
      operationId: terminateRecruitmentApplication
      x-implementation-status: code-complete
      summary: Reject or withdraw an application with a reason
      x-requirement: REC-03.2
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: terminalAction, in: path, required: true, schema: { type: string, enum: [reject, withdraw] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200':
          description: Application terminated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RecruitmentApplication' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/interviews:
    get:
      tags: [Recruitment Interviews]
      operationId: listRecruitmentInterviews
      x-implementation-status: code-complete
      summary: Search interviews visible to the actor
      x-requirement: REC-04.1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: applicationId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: interviewerUserId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InterviewStatus' } }
      responses:
        '200': { description: Paged interviews, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Recruitment Interviews]
      operationId: scheduleRecruitmentInterview
      x-implementation-status: code-complete
      summary: Schedule an interview and enqueue invitations
      x-requirement: REC-04.1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewWrite' } } } }
      responses:
        '201':
          description: Interview scheduled
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/interviews/{interviewId}/{action}:
    post:
      tags: [Recruitment Interviews]
      operationId: transitionRecruitmentInterview
      x-implementation-status: code-complete
      summary: Reschedule, complete or cancel an interview
      x-requirement: REC-04.1
      parameters:
        - $ref: '#/components/parameters/InterviewId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [reschedule, complete, cancel] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewAction' } } } }
      responses:
        '200':
          description: Interview updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/interviews/{interviewId}/evaluations:
    get:
      tags: [Recruitment Evaluations]
      operationId: listInterviewEvaluations
      x-implementation-status: code-complete
      summary: List evaluations subject to blind-evaluation policy
      x-requirement: REC-05.1
      parameters: [{ $ref: '#/components/parameters/InterviewId' }]
      responses:
        '200': { description: Evaluations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evaluation' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Recruitment Evaluations]
      operationId: submitInterviewEvaluation
      x-implementation-status: code-complete
      summary: Submit an immutable scorecard
      x-requirement: REC-05.1
      parameters: [{ $ref: '#/components/parameters/InterviewId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationWrite' } } } }
      responses:
        '201':
          description: Evaluation submitted
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Evaluation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/evaluations/{evaluationId}/unlock:
    post:
      tags: [Recruitment Evaluations]
      operationId: unlockInterviewEvaluation
      x-implementation-status: code-complete
      summary: Unlock by creating a new auditable evaluation version
      x-requirement: REC-05.1
      parameters: [{ $ref: '#/components/parameters/EvaluationId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200':
          description: New evaluation version
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Evaluation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/recruitment/offers:
    get:
      tags: [Recruitment Offers]
      operationId: listRecruitmentOffers
      x-implementation-status: code-complete
      summary: Search offers in the actor's scope
      x-requirement: REC-06.1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: applicationId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OfferStatus' } }
      responses:
        '200': { description: Paged offers, content: { application/json: { schema: { $ref: '#/components/schemas/OfferPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Recruitment Offers]
      operationId: createRecruitmentOffer
      x-implementation-status: code-complete
      summary: Create a draft offer
      x-requirement: REC-06.1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OfferWrite' } } } }
      responses:
        '201':
          description: Draft offer created
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/offers/{offerId}:
    get:
      tags: [Recruitment Offers]
      operationId: getRecruitmentOffer
      x-implementation-status: code-complete
      summary: Get one offer
      x-requirement: REC-06.1
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      responses:
        '200':
          description: Offer
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/recruitment/offers/{offerId}/{action}:
    post:
      tags: [Recruitment Offers]
      operationId: transitionRecruitmentOffer
      x-implementation-status: code-complete
      summary: Approve, send, extend or cancel an offer
      x-requirement: REC-06.1
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, send, extend, cancel] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/OfferAction' } } } }
      responses:
        '200':
          description: Offer updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/recruitment/offers/{offerId}/response:
    post:
      tags: [Recruitment Offers]
      operationId: respondToRecruitmentOffer
      x-implementation-status: code-complete
      summary: Accept or decline as the candidate
      description: Acceptance idempotently creates an employee, initial contract and onboarding checklist.
      x-requirement: REC-06.2
      security: [{ offerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OfferId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OfferResponse' } } } }
      responses:
        '200': { description: Response recorded or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/OfferResponseResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      x-implementation-status: code-complete
      summary: Search the scope-filtered employee directory
      x-requirement: EMP-01.1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: departmentId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: positionId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmployeeStatus' } }
        - { name: sort, in: query, description: 'Allowlist is name, -name, employeeCode, hireDate.', schema: { type: string, default: name } }
      responses:
        '200': { description: Paged employees, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/employees/{employeeId}:
    get:
      tags: [Employees]
      operationId: getEmployee
      x-implementation-status: code-complete
      summary: Get an employee with sensitive fields masked by policy
      x-requirement: EMP-01.1
      parameters: [{ $ref: '#/components/parameters/EmployeeId' }]
