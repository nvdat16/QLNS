name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    name: Markdown links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate internal links and anchors
        run: python3 scripts/check_doc_links.py
