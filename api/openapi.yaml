    EmployeeDocument: { type: object, required: [id, employeeId, documentType, version, originalFileName, contentType, sizeBytes, uploadedAt], properties: { id: { type: integer, format: int64 }, employeeId: { type: integer, format: int64 }, documentType: { type: string }, version: { type: integer, minimum: 1 }, originalFileName: { type: string }, contentType: { type: string }, sizeBytes: { type: integer, format: int64 }, retentionUntil: { type: string, format: date, nullable: true }, uploadedAt: { type: string, format: date-time } } }
    EmployeeDocumentUpload: { type: object, additionalProperties: false, required: [file, documentType], properties: { file: { type: string, format: binary }, documentType: { type: string, maxLength: 80 }, retentionUntil: { type: string, format: date, nullable: true } } }
    SignedDownload: { type: object, required: [url, expiresAt], properties: { url: { type: string, format: uri }, expiresAt: { type: string, format: date-time } } }

    ContractType: { type: string, enum: [probation, fixed_term, indefinite, internship, service_contract] }
