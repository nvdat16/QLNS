      x-requirement: EMP-06.1
      x-implementation-status: code-complete
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbationReviewWrite' } } } }
      responses:
        '200':
          description: Assessment saved
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProbationReview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/probation-reviews:
    get:
      tags: [Probation]
      operationId: listProbationReviews
      summary: Search probation reviews, including overdue ones
      x-requirement: EMP-06.1
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProbationReviewStatus' } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: departmentId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Paged probation reviews, content: { application/json: { schema: { $ref: '#/components/schemas/ProbationReviewPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/probation-reviews/{reviewId}/{action}:
    post:
      tags: [Probation]
      operationId: decideProbationReview
      summary: Decide or cancel a probation review
      description: >-
        Deciding requires an outcome and an effective date, and atomically creates the matching
        employee event. A terminated outcome also opens an offboarding case.
      x-requirement: EMP-06.2
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [decide, cancel, unlock] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ProbationDecisionRequest' } } } }
      responses:
        '200':
          description: Review decided and employee event created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProbationReview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/offboarding/cases:
    get:
      tags: [Offboarding]
      operationId: listOffboardingCases
      summary: Search offboarding cases
      x-requirement: EMP-07.1
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OffboardingStatus' } }
        - { name: departmentId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Paged offboarding cases, content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingCasePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Offboarding]
      operationId: createOffboardingCase
      summary: Open an offboarding case
      description: >-
        Refused when the employee already has an open case. A shorter-than-required notice period
        is reported as a warning in the response rather than blocking the case.
      x-requirement: EMP-07.1
      x-implementation-status: code-complete
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingCaseWrite' } } } }
      responses:
        '201':
          description: Case created
          headers: { Location: { $ref: '#/components/headers/Location' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingCase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/offboarding/cases/{caseId}:
    get:
      tags: [Offboarding]
      operationId: getOffboardingCase
      summary: Get one offboarding case with its blocking-task summary
      x-requirement: EMP-07.1
      x-implementation-status: code-complete
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200':
          description: Offboarding case
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingCase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/offboarding/cases/{caseId}/{action}:
    post:
      tags: [Offboarding]
      operationId: transitionOffboardingCase
      summary: Approve, start, complete or cancel an offboarding case
      description: >-
        Completing is refused while any blocking task is unfinished or the final settlement is
        not paid or waived. Cancelling approved leave that starts after the last working date is
        deferred with the Attendance & Leave module and is not part of this delivery.
      x-requirement: EMP-07.2
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, start, complete, cancel] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } } }
      responses:
        '200':
          description: Case state updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingCase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/offboarding/cases/{caseId}/tasks:
    get:
      tags: [Offboarding]
      operationId: listOffboardingTasks
      summary: List the handover and asset-recovery checklist of a case
      x-requirement: EMP-07.2
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - { name: category, in: query, schema: { $ref: '#/components/schemas/OffboardingTaskCategory' } }
        - { name: blockingOnly, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Checklist tasks, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OffboardingTask' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/offboarding/tasks/{taskId}/{action}:
    post:
      tags: [Offboarding]
      operationId: transitionOffboardingTask
      summary: Start, complete or reopen an offboarding checklist task
      x-requirement: EMP-07.2
      x-implementation-status: code-complete
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, complete, reopen] } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } } }
      responses:
        '200':
          description: Task updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OffboardingTask' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Return process liveness without dependency or secret details
      description: >-
        Platform probe required by the deployment view in docs/architecture.md, not a business
        function on the functional decomposition map. It has no requirement identifier because
        System Administration is out of scope for this delivery.
      x-implementation-status: code-complete
      security: []
      responses:
        '200': { description: Process is alive, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }

  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Return aggregate readiness without exposing dependency details
      description: >-
        Platform probe required by the deployment view in docs/architecture.md, not a business
        function on the functional decomposition map. It has no requirement identifier because
        System Administration is out of scope for this delivery.
      x-implementation-status: code-complete
      security: []
      responses:
        '200': { description: Service is ready, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
        '503': { description: Service is not ready, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: OIDC access token for workforce users. }
    offerToken: { type: apiKey, in: header, name: X-Offer-Token, description: Short-lived single-offer candidate token. }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"4"' }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    RequisitionId: { name: requisitionId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    IntakeId: { name: intakeId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    InterviewId: { name: interviewId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    OfferId: { name: offerId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    DepartmentId: { name: departmentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    PositionId: { name: positionId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    EventId: { name: eventId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ContractId: { name: contractId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AddendumId: { name: addendumId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    CaseId: { name: caseId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  headers:
    ETag: { description: Quoted numeric resource version., schema: { type: string, example: '"5"' } }
    Location: { description: Created resource URI., schema: { type: string, format: uri-reference } }
  responses:
    BadRequest: { description: Malformed request or If-Match header, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Unauthorized: { description: Authentication is required or invalid, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Forbidden: { description: 'Insufficient permission, field access or data scope', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    NotFound: { description: Resource is not visible or does not exist, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Conflict: { description: 'Workflow, prerequisite, uniqueness or concurrency conflict', content: { application/problem+json: { schema: { $ref: '#/components/schemas/BusinessProblemDetails' } } } }
    UnprocessableEntity: { description: Semantically invalid fields, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblemDetails' } } } }
    PayloadTooLarge: { description: File exceeds its documented limit, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    UnsupportedMediaType: { description: File type is not allowed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    PageMetadata:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties: { page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1 }, totalItems: { type: integer, format: int64, minimum: 0 }, totalPages: { type: integer, minimum: 0 } }
    ReasonRequest: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 1000 } } }
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, correlationId]
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer, minimum: 400, maximum: 599 }, detail: { type: string }, instance: { type: string }, correlationId: { type: string }, code: { type: string } }
    BusinessProblemDetails:
      allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [code], properties: { code: { type: string } } }]
    ValidationProblemDetails:
      allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [errors], properties: { errors: { type: object, additionalProperties: { type: array, items: { type: string } } } } }]

    RequisitionStatus: { type: string, enum: [draft, pending_approval, approved, active_recruiting, closed, cancelled] }
    EmploymentType: { type: string, enum: [full_time, part_time, hybrid, remote, internship, service_contract] }
    RequisitionWrite:
      type: object
      required: [title, departmentId, employmentType, targetHeadcount]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        departmentId: { type: integer, format: int64, minimum: 1 }
        positionId: { type: integer, format: int64, minimum: 1, nullable: true }
        description: { type: string, maxLength: 20000, nullable: true }
        requirements: { type: string, maxLength: 20000, nullable: true }
        location: { type: string, maxLength: 255, nullable: true }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        salaryMin: { type: number, minimum: 0, nullable: true }
        salaryMax: { type: number, minimum: 0, nullable: true }
        targetHeadcount: { type: integer, minimum: 1 }
        closingDate: { type: string, format: date, nullable: true }
    Requisition:
      allOf:
        - $ref: '#/components/schemas/RequisitionWrite'
        - type: object
          required: [id, jobCode, status, version, createdAt, updatedAt]
          properties: { id: { type: integer, format: int64 }, jobCode: { type: string }, status: { $ref: '#/components/schemas/RequisitionStatus' }, publishedAt: { type: string, format: date-time, nullable: true }, createdBy: { type: integer, format: int64 }, version: { type: integer, format: int64, minimum: 1 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    RequisitionAction:
      type: object
      additionalProperties: false
      description: Channel selection was removed with Recruitment Channel Management; publishing takes no channel list.
      properties: { reason: { type: string, minLength: 1, maxLength: 1000, nullable: true } }
    RequisitionPage: { type: object, required: [items, page], properties: { items: { type: array, items: { $ref: '#/components/schemas/Requisition' } }, page: { $ref: '#/components/schemas/PageMetadata' } } }

    CandidateInput:
      type: object
      required: [firstName, lastName, email]
      properties: { firstName: { type: string, maxLength: 100 }, lastName: { type: string, maxLength: 100 }, email: { type: string, format: email, maxLength: 320 }, phone: { type: string, maxLength: 30, nullable: true }, linkedinUrl: { type: string, format: uri, nullable: true }, portfolioUrl: { type: string, format: uri, nullable: true } }
    CandidateSummary:
      allOf: [{ $ref: '#/components/schemas/CandidateInput' }, { type: object, required: [id], properties: { id: { type: integer, format: int64 } } }]
    ResumeUpload:
      type: object
      additionalProperties: false
      required: [file, requisitionId, privacyNoticeVersion, consented]
      properties: { file: { type: string, format: binary }, requisitionId: { type: integer, format: int64, minimum: 1 }, privacyNoticeVersion: { type: string, maxLength: 50 }, consented: { type: boolean, enum: [true] } }
    CandidateIntake:
      type: object
      required: [id, requisitionId, status, uploadedAt]
      properties: { id: { type: string, format: uuid }, requisitionId: { type: integer, format: int64 }, status: { type: string, enum: [scanning, parsing, awaiting_confirmation, duplicate_review, completed, rejected, failed] }, parsedCandidate: { $ref: '#/components/schemas/CandidateInput' }, confidence: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }, duplicateCandidates: { type: array, items: { $ref: '#/components/schemas/CandidateSummary' } }, uploadedAt: { type: string, format: date-time } }
    ConfirmIntake:
      type: object
      additionalProperties: false
      required: [candidate]
      properties: { candidate: { $ref: '#/components/schemas/CandidateInput' }, existingCandidateId: { type: integer, format: int64, minimum: 1, nullable: true }, source: { type: string, maxLength: 80, default: direct } }

    RecruitmentStage: { type: string, enum: [sourced_applied, ai_screening, tech_interview, executive_round, offer_letter, hired_ready, rejected, withdrawn] }
    ActiveRecruitmentStage: { type: string, enum: [sourced_applied, ai_screening, tech_interview, executive_round, offer_letter, hired_ready] }
    RecruitmentApplication:
      type: object
      required: [id, candidateId, jobPostingId, stage, source, appliedAt, version, updatedAt]
      properties: { id: { type: integer, format: int64 }, candidateId: { type: integer, format: int64 }, jobPostingId: { type: integer, format: int64 }, resumeId: { type: integer, format: int64, nullable: true }, stage: { $ref: '#/components/schemas/RecruitmentStage' }, aiScore: { type: number, minimum: 0, maximum: 100, nullable: true }, source: { type: string }, appliedAt: { type: string, format: date-time }, version: { type: integer, format: int64, minimum: 1 }, updatedAt: { type: string, format: date-time } }
    RecruitmentApplicationDetail:
      allOf: [{ $ref: '#/components/schemas/RecruitmentApplication' }, { type: object, required: [candidate], properties: { candidate: { $ref: '#/components/schemas/CandidateSummary' }, requisition: { $ref: '#/components/schemas/Requisition' } } }]
    AdvanceApplicationRequest: { type: object, additionalProperties: false, required: [targetStage], properties: { targetStage: { $ref: '#/components/schemas/ActiveRecruitmentStage' }, reason: { type: string, maxLength: 1000, nullable: true } } }
    PipelineCard: { type: object, required: [application, candidate], properties: { application: { $ref: '#/components/schemas/RecruitmentApplication' }, candidate: { $ref: '#/components/schemas/CandidateSummary' } } }
    PipelineColumn: { type: object, required: [stage, totalItems, items], properties: { stage: { $ref: '#/components/schemas/RecruitmentStage' }, totalItems: { type: integer, minimum: 0 }, averageAiScore: { type: number, nullable: true }, items: { type: array, items: { $ref: '#/components/schemas/PipelineCard' } } } }
    RecruitmentPipeline: { type: object, required: [requisitionId, columns], properties: { requisitionId: { type: integer, format: int64 }, columns: { type: array, items: { $ref: '#/components/schemas/PipelineColumn' } } } }

    InterviewStatus: { type: string, enum: [scheduled, completed, cancelled, no_show] }
    InterviewWrite:
      type: object
      required: [applicationId, interviewType, startsAt, endsAt, timezone, interviewerUserIds]
      properties: { applicationId: { type: integer, format: int64, minimum: 1 }, interviewType: { type: string, maxLength: 50 }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time }, timezone: { type: string, example: Asia/Ho_Chi_Minh }, interviewerUserIds: { type: array, minItems: 1, uniqueItems: true, description: 'Interview panel, persisted in interview_panelists; the first id is the lead interviewer (interviews.interviewer_user_id).', items: { type: integer, format: int64, minimum: 1 } }, location: { type: string, nullable: true }, meetingUrl: { type: string, format: uri, nullable: true } }
    Interview:
      allOf: [{ $ref: '#/components/schemas/InterviewWrite' }, { type: object, required: [id, status, version], properties: { id: { type: integer, format: int64 }, status: { $ref: '#/components/schemas/InterviewStatus' }, cancellationReason: { type: string, nullable: true }, version: { type: integer, format: int64, minimum: 1 } } }]
    InterviewAction: { type: object, additionalProperties: false, properties: { startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time }, timezone: { type: string }, location: { type: string }, meetingUrl: { type: string, format: uri }, reason: { type: string, maxLength: 1000 } } }
    InterviewPage: { type: object, required: [items, page], properties: { items: { type: array, items: { $ref: '#/components/schemas/Interview' } }, page: { $ref: '#/components/schemas/PageMetadata' } } }
    Score: { type: number, format: float, minimum: 0, maximum: 5, multipleOf: 0.5 }
    EvaluationWrite:
      type: object
      required: [technicalScore, communicationScore, problemSolvingScore, teamworkScore, recommendation, feedback]
      properties: { technicalScore: { $ref: '#/components/schemas/Score' }, communicationScore: { $ref: '#/components/schemas/Score' }, problemSolvingScore: { $ref: '#/components/schemas/Score' }, teamworkScore: { $ref: '#/components/schemas/Score' }, recommendation: { type: string, enum: [strong_hire, hire, hold, no_hire, strong_no_hire] }, feedback: { type: string, minLength: 1, maxLength: 10000 } }
    Evaluation:
      allOf: [{ $ref: '#/components/schemas/EvaluationWrite' }, { type: object, required: [id, interviewId, evaluatorUserId, overallScore, submittedAt, version], properties: { id: { type: integer, format: int64 }, interviewId: { type: integer, format: int64 }, evaluatorUserId: { type: integer, format: int64 }, overallScore: { type: number, minimum: 0, maximum: 5 }, submittedAt: { type: string, format: date-time }, unlockedAt: { type: string, format: date-time, nullable: true }, version: { type: integer, minimum: 1 } } }]

    OfferStatus: { type: string, enum: [draft, approved, sent, accepted, declined, expired, cancelled] }
    OfferWrite:
      type: object
      required: [applicationId, baseSalary, employmentType, startDate, expirationDate, templateVersion]
      properties: { applicationId: { type: integer, format: int64, minimum: 1 }, baseSalary: { type: number, minimum: 0 }, bonusAmount: { type: number, minimum: 0, nullable: true }, allowanceAmount: { type: number, minimum: 0, nullable: true }, currency: { type: string, pattern: '^[A-Z]{3}$', default: VND }, employmentType: { $ref: '#/components/schemas/EmploymentType' }, startDate: { type: string, format: date }, expirationDate: { type: string, format: date }, templateVersion: { type: string, maxLength: 50 } }
    Offer:
      allOf: [{ $ref: '#/components/schemas/OfferWrite' }, { type: object, required: [id, status, version, createdAt, updatedAt], properties: { id: { type: integer, format: int64 }, status: { $ref: '#/components/schemas/OfferStatus' }, documentAvailable: { type: boolean }, approvedBy: { type: integer, format: int64, nullable: true }, approvedAt: { type: string, format: date-time, nullable: true }, sentAt: { type: string, format: date-time, nullable: true }, respondedAt: { type: string, format: date-time, nullable: true }, version: { type: integer, format: int64 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } } }]
    OfferAction: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 1000 }, expirationDate: { type: string, format: date } } }
