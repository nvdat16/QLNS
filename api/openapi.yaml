    PersonalProfilePatch: { type: object, additionalProperties: false, minProperties: 1, properties: { personalEmail: { type: string, format: email, nullable: true }, phone: { type: string, maxLength: 30, nullable: true }, temporaryAddress: { type: string, maxLength: 1000, nullable: true }, emergencyContact: { type: object, nullable: true, additionalProperties: { type: string } } } }
